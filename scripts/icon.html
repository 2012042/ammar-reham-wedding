<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 512px; height: 512px; background: transparent; overflow: hidden; }
  .seal {
    width: 512px; height: 512px; border-radius: 50%; display: grid; place-items: center; color: #fff6df;
    background: radial-gradient(circle at 35% 30%, #d9bb82, #a98445 70%, #8e6c33);
    box-shadow: inset 0 0 0 16px rgba(255, 255, 255, 0.22);
  }
  .mono {
    display: flex; align-items: baseline; margin-top: -60px; letter-spacing: -2px;
    font: 700 200px/1 "Amiri", serif; -webkit-text-stroke: 3px #fff6df;
  }
  .mono b { font-size: 1.1em; font-weight: 700; }
  .mono i {
    font: 500 96px/1 "Cormorant Garamond", serif; font-style: normal; opacity: 0.88;
    margin: 0 6px 0 10px; align-self: center; margin-bottom: 16px;
  }
</style>
</head>
<body><div class="seal"><span class="mono">ع<i>&amp;</i><b>ر</b></span></div></body>
</html>
