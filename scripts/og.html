<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:wght@500&family=Tajawal:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        display: flex;
        background: radial-gradient(
          120% 90% at 30% 0%,
          #fffdf8 0%,
          #f7f2e9 60%,
          #efe7d8 100%
        );
        color: #584d41;
        font-family: "Tajawal", sans-serif;
      }
      .photo {
        width: 440px;
        height: 630px;
        padding: 34px 34px 34px 0;
        flex: none;
      }
      .photo div {
        width: 100%;
        height: 100%;
        border-radius: 18px;
        overflow: hidden;
        border: 8px solid rgba(255, 255, 255, 0.75);
        box-shadow: 0 24px 50px -26px rgba(90, 70, 40, 0.6);
        background: url("../public/childs.jpg") center / cover;
      }
      .text {
        position: relative;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        margin: 34px;
      }
      .frame {
        position: absolute;
        inset: 0;
        border: 1px solid rgba(176, 141, 79, 0.45);
      }
      .frame::after {
        content: "";
        position: absolute;
        inset: 10px;
        border: 1px solid rgba(176, 141, 79, 0.22);
      }
      .kicker {
        font-size: 30px;
        color: #94887a;
        letter-spacing: 0.02em;
      }
      .names {
        font-family: "Aref Ruqaa", serif;
        font-size: 132px;
        line-height: 1.15;
        margin: 4px 0 2px;
      }
      .names i {
        font-style: normal;
        color: #b08d4f;
        font-size: 0.5em;
        margin: 0 18px;
      }
      .div {
        display: flex;
        align-items: center;
        gap: 14px;
        color: #b08d4f;
        margin: 8px 0 16px;
      }
      .div span {
        width: 90px;
        height: 1px;
        background: rgba(176, 141, 79, 0.6);
      }
      .div b {
        width: 12px;
        height: 12px;
        border: 1.5px solid #b08d4f;
        transform: rotate(45deg);
      }
      .date {
        font-family: "Cormorant Garamond", serif;
        font-size: 46px;
        letter-spacing: 0.25em;
        color: #b08d4f;
        direction: ltr;
      }
      .venue {
        margin-top: 10px;
        font-size: 26px;
        color: #94887a;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .venue em {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #b08d4f;
      }
    </style>
  </head>
  <body>
    <div class="photo"><div></div></div>
    <div class="text">
      <span class="frame"></span>
      <p class="kicker">ندعوكم لمشاركتنا حفل زفاف</p>
      <h1 class="names">عمار<i>و</i>رهام</h1>
      <div class="div"><span></span><b></b><span></span></div>
      <p class="date">22 . 11 . 2026</p>
      <p class="venue">
        <span>الأحد</span><em></em><span>الساعة ٨ مساءً</span><em></em
        ><span>صالة شوفال</span>
      </p>
    </div>
  </body>
</html>
